name: Build main pre-release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prerelease-main
  cancel-in-progress: true

jobs:
  build-prerelease-apk:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install NDK for native library stripping
        run: |
          ANDROID_TOOLS="$ANDROID_HOME/cmdline-tools/latest/bin"
          if [[ -x "$ANDROID_TOOLS/android" ]]; then
            "$ANDROID_TOOLS/android" --no-metrics --sdk="$ANDROID_HOME" sdk install "ndk;28.2.13676358"
          else
            "$ANDROID_TOOLS/sdkmanager" --sdk_root="$ANDROID_HOME" "ndk;28.2.13676358"
          fi

      - name: Prepare release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "Missing secret: ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "${RUNNER_TEMP}/release.keystore"

      - name: Build signed release APK (universal)
        env:
          ANDROID_SIGNING_STORE_FILE: ${{ runner.temp }}/release.keystore
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          for var_name in ANDROID_SIGNING_STORE_FILE ANDROID_SIGNING_STORE_PASSWORD ANDROID_SIGNING_KEY_ALIAS ANDROID_SIGNING_KEY_PASSWORD; do
            if [[ -z "${!var_name}" ]]; then
              echo "Missing required signing value: ${var_name}"
              exit 1
            fi
          done
          ./gradlew :app:assembleRelease

      - name: Rename APK
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          if [[ ! -f "$APK_PATH" ]]; then
            echo "APK not found at $APK_PATH"
            exit 1
          fi
          cp "$APK_PATH" "moememos-main.apk"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: moememos-main-${{ github.sha }}
          path: moememos-main.apk

      - name: Publish rolling pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: pre-release
          APK_NAME: moememos-main.apk
        run: |
          set -u

          VERSION_NAME=$(awk -F '"' '/versionName[[:space:]]*=/ { print $2; exit }' app/build.gradle)
          VERSION_CODE=$(awk '/versionCode[[:space:]]*=/ { print $3; exit }' app/build.gradle)
          if [[ -z "$VERSION_NAME" || -z "$VERSION_CODE" ]]; then
            echo "Could not read versionName/versionCode from app/build.gradle"
            exit 1
          fi
          SHORT_SHA=$(git rev-parse --short=7 "$GITHUB_SHA")
          SUBJECT=$(git log -1 --format=%s "$GITHUB_SHA")

          NOTES_FILE="${RUNNER_TEMP}/prerelease-notes.md"
          {
            printf '%s\n\n' "Pre-release built from the latest [\`main\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commits/main) commit. Each push replaces the APK on this release."
            printf -- '- Version: %s (%s)\n' "$VERSION_NAME" "$VERSION_CODE"
            printf -- '- Commit: [`%s`](%s/%s/commit/%s)\n' "$SHORT_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA"
            printf -- '- Message: %s\n' "$SUBJECT"
            printf -- '- Workflow run: [%s](%s/%s/actions/runs/%s)\n' "$GITHUB_RUN_ID" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          } > "$NOTES_FILE"

          # Keep one tag for main and move it to the commit that was built.
          git tag -f "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/${RELEASE_TAG}" --force

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "main" \
              --prerelease=true \
              --latest=false \
              --notes-file "$NOTES_FILE"
          else
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "main" \
              --prerelease \
              --latest=false \
              --verify-tag \
              --notes-file "$NOTES_FILE"
          fi

          gh release upload "$RELEASE_TAG" "$APK_NAME" --clobber

          mapfile -t assets < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
          for name in "${assets[@]}"; do
            if [[ "$name" != "$APK_NAME" ]]; then
              gh release delete-asset "$RELEASE_TAG" "$name" --yes
            fi
          done
