    implementation "com.squareup.okhttp3:okhttp:${rootProject.ext.okhttp_version}"
    implementation "com.squareup.okhttp3:okhttp-urlconnection:${rootProject.ext.okhttp_version}"
    implementation "com.github.skydoves:sandwich:${rootProject.ext.sandwich}"
    implementation "com.github.skydoves:sandwich-retrofit:${rootProject.ext.sandwich}"
    implementation "com.github.skydoves:sandwich-retrofit-serialization:${rootProject.ext.sandwich}"
    implementation "io.coil-kt.coil3:coil-compose:${rootProject.ext.coil_version}"
