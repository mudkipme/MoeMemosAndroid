plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'com.google.dagger.hilt.android'
    id 'com.google.devtools.ksp'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def releaseSigningStoreFile = System.getenv("ANDROID_SIGNING_STORE_FILE")
def releaseSigningStorePassword = System.getenv("ANDROID_SIGNING_STORE_PASSWORD")
def releaseSigningKeyAlias = System.getenv("ANDROID_SIGNING_KEY_ALIAS")
def releaseSigningKeyPassword = System.getenv("ANDROID_SIGNING_KEY_PASSWORD")
def hasReleaseSigning = [
    releaseSigningStoreFile,
    releaseSigningStorePassword,
    releaseSigningKeyAlias,
    releaseSigningKeyPassword
].every { it != null && !it.trim().isEmpty() }

android {
    compileSdk = 37
    // Provides llvm-strip for native libraries bundled by AndroidX.
    ndkVersion = '28.2.13676358'

    dependenciesInfo {
        // Disables dependency metadata when building APKs.
        includeInApk = false
        // Disables dependency metadata when building Android App Bundles.
        includeInBundle = false
    }

    defaultConfig {
        applicationId = "me.mudkip.moememos"
        minSdk = 26
        targetSdk = 37
        versionCode = 50
        versionName = "2.0.5"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary = true
        }
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseSigningStoreFile)
                storePassword releaseSigningStorePassword
                keyAlias releaseSigningKeyAlias
                keyPassword releaseSigningKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            crunchPngs = false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        compose = true
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    namespace = 'me.mudkip.moememos'
}

dependencies {
    implementation "androidx.core:core-ktx:${rootProject.ext.core_ktx_version}"
    implementation "androidx.compose.ui:ui:${rootProject.ext.compose_version}"
    implementation "androidx.compose.foundation:foundation:${rootProject.ext.compose_version}"
    implementation "androidx.compose.material:material-icons-extended:${rootProject.ext.compose_material}"
    implementation "androidx.compose.material3:material3:${rootProject.ext.material3}"
    implementation "androidx.compose.material3.adaptive:adaptive:${rootProject.ext.material3_adaptive}"
    implementation "androidx.compose.material3.adaptive:adaptive-layout:${rootProject.ext.material3_adaptive}"
    implementation "androidx.compose.material3.adaptive:adaptive-navigation:${rootProject.ext.material3_adaptive}"
    implementation "androidx.compose.ui:ui-tooling-preview:${rootProject.ext.compose_version}"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:${rootProject.ext.lifecycle_version}"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:${rootProject.ext.lifecycle_version}"
    implementation "androidx.lifecycle:lifecycle-process:${rootProject.ext.lifecycle_version}"
    implementation "androidx.activity:activity-compose:${rootProject.ext.activity_compose_version}"
    implementation "androidx.navigation:navigation-compose:${rootProject.ext.nav_version}"
    implementation "androidx.paging:paging-runtime-ktx:${rootProject.ext.paging_version}"
    implementation "androidx.paging:paging-compose:${rootProject.ext.paging_version}"
    implementation "androidx.room:room-runtime:${rootProject.ext.room_version}"
    implementation "androidx.room:room-ktx:${rootProject.ext.room_version}"
    ksp "androidx.room:room-compiler:${rootProject.ext.room_version}"
