    debugImplementation "androidx.compose.ui:ui-tooling:${rootProject.ext.compose_version}"
    debugImplementation "androidx.compose.ui:ui-test-manifest:${rootProject.ext.compose_version}"
    
    // Glance for App Widget
    implementation "androidx.glance:glance:${rootProject.ext.glance_version}"
    implementation "androidx.glance:glance-appwidget:${rootProject.ext.glance_version}"
    implementation "androidx.glance:glance-material3:${rootProject.ext.glance_version}"
    implementation "androidx.work:work-runtime-ktx:${rootProject.ext.work_version}"
